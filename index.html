      else if (target.free) sub += ', ' + t('min', { n: minutes(target) });
      els.cta.hidden = false;
      els.cta.classList.toggle('is-locked', !isOpen(target));
      els.cta.querySelector('b').textContent = label;
      els.cta.querySelector('span').textContent = sub;
      els.cta.onclick = () => (isOpen(target) ? goChapter(target) : openLock(target));
    }

    // Список глав
    els.list.replaceChildren();
    CHAPTERS.forEach((ch) => {
      const state = chapterState(ch);
      const p = progress[ch.id];
      const li = el('li');
      const b = el('button', 'ch is-' + state);
      b.type = 'button';
      b.append(el('span', 'ch-num', ch.num ? String(ch.num) : ''), el('span', 'ch-title', title(ch)));

      const meta = el('span', 'ch-meta');
      if (state === 'locked') {
        if (ch.adult) meta.append(el('span', 'badge', '18+'));
        meta.append(lockIcon(), document.createTextNode(t('locked')));
      } else if (state === 'read') {
        meta.textContent = t('read');
      } else if (state === 'reading') {
        meta.textContent = p.pct + '%';
      } else {
        meta.textContent = ch.free ? t('min', { n: minutes(ch) }) : '';
        if (ch.adult) meta.prepend(el('span', 'badge', '18+'));
      }
      b.append(meta);

      if (state === 'reading') {
        const bar = el('span', 'ch-bar');
        const fill = el('i');
        fill.style.width = p.pct + '%';
        bar.append(fill);
        b.append(bar);
      }

      b.onclick = () => (isOpen(ch) ? goChapter(ch) : openLock(ch));
      li.append(b);
      els.list.append(li);
    });
  }


  /* =======================================================
     7. ПЕРЕХОДЫ МЕЖДУ ЭКРАНАМИ
     Адрес страницы: #ch2 — открыта глава 2, пусто — оглавление.
     ======================================================= */
  function goChapter(ch) {
    openedFromToc = true;
    location.hash = ch.id;            // дальше сработает route()
  }

  function replaceHash(id) {
    const url = id ? '#' + id : location.pathname + location.search;
    try {
      history.replaceState(null, '', url);
      route();
    } catch (e) {
      location.replace('#' + (id || ''));
    }
  }

  function goToc() {
    saveNow();
    if (openedFromToc) {
      openedFromToc = false;
      history.back();
    } else {
      replaceHash('');
    }
  }

  function route() {
    const id = decodeURIComponent(location.hash.replace(/^#/, ''));
    const ch = CHAPTERS.find((c) => c.id === id);
    if (ch && isOpen(ch)) { openChapter(ch); return; }
    showToc();
    if (ch && !isOpen(ch)) openLock(ch);
  }

  function showToc() {
    Pager.unmount();
    if (current) { saveNow(); current = null; }
    openedFromToc = false;
    els.reader.hidden = true;
    els.toc.hidden = false;
    document.title = BOOK.title[lang];
    renderToc();
    syncBackButton();
    window.scrollTo(0, 0);
  }


  /* =======================================================
     8. ЭКРАН ЧТЕНИЯ
     ======================================================= */
  function openChapter(ch, keepPct) {
    if (current && current !== ch) saveNow();
    current = ch;
    closeSheet(true);
    Pager.unmount();
    if (keepPct == null) keepPct = Pager.takePending();

    els.toc.hidden = true;
    els.reader.hidden = false;

    els.kicker.hidden = !ch.num;
    els.kicker.textContent = ch.num ? t('chapter', { n: ch.num }) : '';
    els.h1.textContent = title(ch);
    els.barTitle.textContent = fullName(ch);
    document.title = fullName(ch) + ' — ' + BOOK.title[lang];

    const txt = chapterText(ch);
    els.trNote.hidden = !txt.fallback;
    els.prose.lang = txt.lang;                 // переносы слов по правилам языка текста

    const frag = document.createDocumentFragment();
    if (!txt.paras.length) {
      frag.append(el('p', 'empty-paid', t('emptyPaid')));
    } else {
      txt.paras.forEach((text) => {
        const p = el('p');
        if (/^(\*\s*){3,}$|^⁂$/.test(text)) { p.className = 'break'; p.textContent = '⁂'; }
        else p.textContent = text;
        frag.append(p);
      });
    }
    els.prose.replaceChildren(frag);
    renderEnd(ch);

    Store.set('last', ch.id);
    showBar(true);
    syncBackButton();

    // Возвращаемся туда, где остановились
    if (S.mode === 'pages') Pager.mount();
    const saved = progress[ch.id];
    userScrolled = false;
    const restore = () => {
      if (Pager.active) Pager.relayout(false);
      if (keepPct != null) scrollToPct(keepPct);
      else if (saved && !saved.done && saved.lang === txt.lang) restoreAnchor(saved);
      else if (saved && !saved.done && saved.pct) scrollToPct(saved.pct / 100);
      else window.scrollTo(0, 0);
      lastY = window.scrollY;
      updateProgress();
    };
    restore();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { if (current === ch && !userScrolled) restore(); });
    }
  }

  function renderEnd(ch) {
    const i = CHAPTERS.indexOf(ch);
    const next = CHAPTERS[i + 1];
    const prev = CHAPTERS[i - 1];
    els.end.replaceChildren();

    if (next && isOpen(next)) {
      const b = el('button', 'cta');
      b.type = 'button';
      b.append(el('b', '', t('nextChapter')), el('span', '', fullName(next)));
      b.onclick = () => replaceHash(next.id);
      els.end.append(b);
    } else if (next) {
      els.end.append(buildPaywall(next));      // главное место продажи — сразу после обрыва
    } else {
      els.end.append(el('p', 'end-note', t('lastNote')));
    }

    const links = el('div', 'end-links');
    if (prev && isOpen(prev)) {
      const pb = el('button', 'link-btn', t('prev', { name: fullName(prev) }));
      pb.type = 'button';
      pb.onclick = () => replaceHash(prev.id);
      links.append(pb);
    } else {
      links.append(el('span'));
    }
    const tb = el('button', 'link-btn', t('contents'));
    tb.type = 'button';
    tb.onclick = goToc;
    links.append(tb);
    els.end.append(links);
    if (Pager.active) Pager.relayout(true);
  }

  function showBar(show) { els.bar.classList.toggle('is-hidden', !show); }

  function getPct() {
    if (Pager.active) return Pager.pct();
    const max = document.documentElement.scrollHeight - window.innerHeight;
    return max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 1;
  }
  function scrollToPct(pct) {
    if (Pager.active) { Pager.goPct(pct); return; }
    const max = document.documentElement.scrollHeight - window.innerHeight;
    window.scrollTo(0, Math.max(0, max * pct));
  }
  function updateProgress() { els.progress.style.transform = 'scaleX(' + getPct() + ')'; }

  // Место чтения запоминается по абзацу — не сбивается при смене шрифта и размера
  function topLine() { return els.bar.offsetHeight + 8; }

  function currentAnchor() {
    if (Pager.active) return Pager.anchor();
    const ps = els.prose.children;
    const line = topLine();
    if (!ps.length || ps[0].getBoundingClientRect().top >= line) return { p: -1, off: 0 };
    let lo = 0, hi = ps.length - 1, found = ps.length - 1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (ps[mid].getBoundingClientRect().bottom > line) { found = mid; hi = mid - 1; }
      else lo = mid + 1;
    }
    const r = ps[found].getBoundingClientRect();
    return { p: found, off: Math.min(1, Math.max(0, (line - r.top) / (r.height || 1))) };
  }

  function restoreAnchor(a) {
    if (Pager.active) { Pager.restore(a); return; }
    const ps = els.prose.children;
    if (!a || a.p < 0 || !ps[a.p]) { window.scrollTo(0, 0); return; }
    const r = ps[a.p].getBoundingClientRect();
    window.scrollTo(0, window.scrollY + r.top - topLine() + a.off * r.height);
  }

  function endReached() { return Pager.active ? Pager.atEnd() : els.end.getBoundingClientRect().top < window.innerHeight - 40; }

  function saveNow() {
    if (!current) return;
    clearTimeout(saveTimer);
    const prev = progress[current.id] || {};
    const a = currentAnchor();
    const done = !!prev.done || endReached();
    progress[current.id] = {
      p: a.p,
      off: Math.round(a.off * 1000) / 1000,
      pct: done ? 100 : Math.round(getPct() * 100),
      done: done,
      lang: els.prose.lang,
    };
    Store.set('progress', progress);
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 400);
  }

  function onScroll() {
    ticking = false;
    if (!current) return;
    const y = window.scrollY;
    const dy = y - lastY;
    if (y < 60) showBar(true);
    else if (dy > 6) showBar(false);
    else if (dy < -6) showBar(true);
    lastY = y;
    updateProgress();
    scheduleSave();
  }

  window.addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
  }, { passive: true });

  ['touchstart', 'wheel', 'keydown'].forEach((type) =>
    window.addEventListener(type, () => { userScrolled = true; }, { passive: true }));

  els.prose.addEventListener('click', () => {
    if (Pager.active) return;
    const sel = window.getSelection && window.getSelection();
    if (sel && String(sel).length) return;
    showBar(els.bar.classList.contains('is-hidden'));
  });

  $('back').onclick = goToc;
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });


  /* =======================================================
     ЛИСТАНИЕ СТРАНИЦ
     Текст главы раскладывается на страницы размером с экран (CSS-колонки).
     «Загиб»: тянешь за угол — страница загибается по линии от угла к пальцу,
     видна её изнанка (бумага с просвечивающим текстом) и тени.
     «Поворот»: простой переворот вокруг левого края (для слабых телефонов).
     Тап справа — вперёд, слева — назад, в середине — показать панель.
     ======================================================= */

  // Звук перелистывания.
  // Если рядом с читалкой лежит файл page-turn.mp3 — играет он (настоящая запись лучше любой синтетики).
  // Если файла нет — звук «листа бумаги» собирается прямо в браузере.
  // Звук готовится заранее, а тишина в начале записи обрезается, чтобы он не опаздывал.
  const Sound = (function () {
    const FILE = 'page-turn.mp3';
    let ctx = null, buf = null, offset = 0, preparing = false;

    function context() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { ctx = new AC(); }
      }
      return ctx;
    }

    function decode(data) {
      return new Promise((ok, fail) => {
        const r = ctx.decodeAudioData(data, ok, fail);   // старый Safari понимает только колбэки
        if (r && r.then) r.then(ok, fail);
      });
    }

    function trimStart(b) {                     // где в записи начинается сам звук
      const d = b.getChannelData(0);
      let peak = 0;
      for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
      const limit = peak * 0.05;
      let i = 0;
      while (i < d.length && Math.abs(d[i]) < limit) i++;
      return Math.max(0, i / b.sampleRate - 0.004);
    }

    // Синтетический лист бумаги: короткий сухой «шорх» + хруст волокон + мягкий хлопок в конце.
    // Почти вся громкость — в первые сотые доли секунды, без медленного разгона.
    function synth() {
      const sr = ctx.sampleRate, len = Math.floor(sr * 0.3);
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      if (!OAC) return Promise.reject(new Error('no offline audio'));
      const off = new OAC(1, len, sr);

      const white = off.createBuffer(1, len, sr);
      const w = white.getChannelData(0);
      for (let i = 0; i < len; i++) w[i] = Math.random() * 2 - 1;

      const crackle = off.createBuffer(1, len, sr);   // редкие щелчки — хруст бумаги
      const c = crackle.getChannelData(0);
      for (let k = 0; k < 70; k++) {
        const at = Math.floor(Math.pow(Math.random(), 1.8) * sr * 0.14);
        const amp = (0.4 + Math.random() * 0.6) * (Math.random() < 0.5 ? -1 : 1);
        for (let j = 0; j < 3 && at + j < len; j++) c[at + j] += amp * (1 - j / 3);
      }

      const t = 0;
      // 1) шорх: шум, фильтр уходит вверх, быстро гаснет
      const s1 = off.createBufferSource(); s1.buffer = white;
      const hp = off.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1700;
      const bp = off.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.7;
      bp.frequency.setValueAtTime(2800, t);
      bp.frequency.exponentialRampToValueAtTime(7000, t + 0.07);
      bp.frequency.exponentialRampToValueAtTime(3600, t + 0.2);
      const g1 = off.createGain();
      g1.gain.setValueAtTime(0.0001, t);
      g1.gain.exponentialRampToValueAtTime(0.6, t + 0.005);
      g1.gain.exponentialRampToValueAtTime(0.2, t + 0.045);
      g1.gain.exponentialRampToValueAtTime(0.05, t + 0.13);
      g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.27);
      s1.connect(hp); hp.connect(bp); bp.connect(g1); g1.connect(off.destination);

      // 2) хруст волокон
      const s2 = off.createBufferSource(); s2.buffer = crackle;
      const hp2 = off.createBiquadFilter(); hp2.type = 'highpass'; hp2.frequency.value = 3200;
      const g2 = off.createGain(); g2.gain.value = 0.35;
      s2.connect(hp2); hp2.connect(g2); g2.connect(off.destination);

      // 3) мягкий хлопок — лист лёг
      const s3 = off.createBufferSource(); s3.buffer = white;
      const lp = off.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
      const g3 = off.createGain();
      g3.gain.setValueAtTime(0.0001, t);
      g3.gain.setValueAtTime(0.0001, t + 0.06);
      g3.gain.exponentialRampToValueAtTime(0.35, t + 0.075);
      g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      s3.connect(lp); lp.connect(g3); g3.connect(off.destination);

      s1.start(t); s2.start(t); s3.start(t);
      return new Promise((ok, fail) => {
        off.oncomplete = (e) => ok(e.renderedBuffer);
        const r = off.startRendering();
        if (r && r.then) r.then(ok, fail);
      });
    }

    // Готовим звук заранее (при открытии главы), чтобы первое перелистывание не было беззвучным
    function prepare() {
      if (buf || preparing || !context()) return;
      preparing = true;
      fetch(FILE)
        .then((r) => { if (!r.ok) throw new Error('no file'); return r.arrayBuffer(); })
        .then(decode)
        .then((b) => { buf = b; offset = trimStart(b); })
        .catch(() => synth().then((b) => { buf = b; offset = 0; }))
        .catch(() => {})
        .then(() => { preparing = false; });
    }

    // Браузер разрешает звук только после касания — «будим» его при первом касании страницы
    function wake() {
      if (!context()) return;
      if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
      prepare();
    }

    function play() {
      if (!S.sound) return;
      wake();
      if (!buf) return;
      try {
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.playbackRate.value = 0.94 + Math.random() * 0.12;   // каждый раз чуть по-разному
        const g = ctx.createGain();
        g.gain.value = 0.9;
        src.connect(g); g.connect(ctx.destination);
        src.start(0, offset);
      } catch (e) {}
    }

    return { play: play, wake: wake, prepare: prepare };
  })();

  const Pager = (function () {
    const article = document.querySelector('.article');
    const home = article.parentNode;
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const pager = document.createElement('div');
    pager.className = 'pager';
    pager.hidden = true;
    pager.innerHTML =
      '<div class="pg-base"><div class="pg-flow"></div></div>' +
      '<i class="pg-cast"></i>' +                                            // тень на нижней странице у сгиба
      '<div class="pg-front"><div class="pg-flow"></div><i class="pg-fshade"></i></div>' +   // переворачиваемая страница
      '<div class="pg-flap"><div class="pg-flow pg-mirror"></div><i class="pg-crease"></i></div>' + // её изнанка
      '<div class="pg-foot" aria-hidden="true"></div>';
    home.append(pager);

    const flowBase = pager.querySelector('.pg-base .pg-flow');
    const front = pager.querySelector('.pg-front');
    const flowFront = front.querySelector('.pg-flow');
    const fshade = front.querySelector('.pg-fshade');
    const flap = pager.querySelector('.pg-flap');
    const flowMirror = flap.querySelector('.pg-flow');
    const crease = flap.querySelector('.pg-crease');
    const cast = pager.querySelector('.pg-cast');
    const foot = pager.querySelector('.pg-foot');
    const sentinel = document.createElement('span');
    sentinel.className = 'pg-sentinel';

    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;' +
      'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
    document.body.append(probe);

    let active = false, page = 0, pages = 1, stride = 1, vw = 1, vh = 1;
    let starts = [], ends = [];
    let drag = null, busy = false, turnedOnce = false, hinted = false, hinting = false;
    let pendingPct = null;

    const effect = () => (reduced ? 'none' : (S.flip === 'flip' ? 'flip' : 'curl'));
    const shift = (el, n) => { el.style.transform = 'translate3d(' + (-n * stride) + 'px,0,0)'; };

    function setPage(n, silent) {
      page = Math.max(0, Math.min(pages - 1, n));
      shift(flowBase, page);
      foot.textContent = (page + 1) + ' / ' + pages;
      updateProgress();
      if (!silent) scheduleSave();
    }

    function copyArticle() {
      const c = article.cloneNode(true);
      c.removeAttribute('id');
      c.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'));
      return c;
    }

    function layout() {
      vw = window.innerWidth;
      vh = window.innerHeight;
      const ps = getComputedStyle(probe);
      const safeTop = parseFloat(ps.paddingTop) || 0;
      const safeBottom = parseFloat(ps.paddingBottom) || 0;
      const maxW = Math.min(vw - 44, S.size * 34);
      const m = Math.max(22, Math.floor((vw - maxW) / 2));
      const W = vw - 2 * m;
      stride = vw;
      const top = Math.round(safeTop + 26);
      const H = Math.max(200, Math.floor(vh - top - safeBottom - 40));
      [flowBase, flowFront, flowMirror].forEach((f) => {
        f.style.left = m + 'px';
        f.style.top = top + 'px';
        f.style.width = W + 'px';
        f.style.height = H + 'px';
        f.style.columnWidth = W + 'px';
        f.style.columnGap = (2 * m) + 'px';
      });
      flowFront.replaceChildren(copyArticle());
      flowMirror.replaceChildren(copyArticle());

      // На какой странице начинается и кончается каждый абзац
      shift(flowBase, 0);
      const fl = flowBase.getBoundingClientRect().left;
      const col = (x) => Math.max(0, Math.floor((x - fl + 2) / stride));
      starts = []; ends = [];
      let last = 0;
      Array.prototype.forEach.call(els.prose.children, (p) => {
        const rs = p.getClientRects();
        if (!rs.length) { starts.push(last); ends.push(last); return; }
        const s = col(rs[0].left), e = col(rs[rs.length - 1].left);
        starts.push(s); ends.push(Math.max(s, e));
        last = Math.max(s, e);
      });
      pages = Math.max(1, col(sentinel.getBoundingClientRect().left) + 1);
      setPage(page, true);
    }

    function mount() {
      if (!active) {
        active = true;
        turnedOnce = false;
        document.body.classList.add('paged');
        pager.hidden = false;
        article.append(sentinel);
        flowBase.append(article);
        page = 0;
        Sound.prepare();
        setTimeout(hint, 1600);
      }
      layout();
    }

    function unmount() {
      if (!active) return;
      active = false;
      hinting = false;
      hideTurn();
      busy = false;
      flowFront.replaceChildren();
      flowMirror.replaceChildren();
      sentinel.remove();
      home.insertBefore(article, pager);
      pager.hidden = true;
      document.body.classList.remove('paged');
      page = 0;
    }

    function relayout(keep) {
      if (!active || drag) return;
      const a = keep ? anchor() : null;
      layout();
      if (keep) restore(a);
    }

    // Место чтения в тех же единицах, что и при прокрутке: номер абзаца и доля внутри него
    function anchor() {
      if (page === 0 || !starts.length) return { p: -1, off: 0 };
      let lo = 0, hi = ends.length - 1, found = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (ends[mid] >= page) { found = mid; hi = mid - 1; } else lo = mid + 1;
      }
      if (found < 0) return { p: ends.length - 1, off: 1 };
      const span = ends[found] - starts[found] + 1;
      return { p: found, off: Math.min(1, Math.max(0, (page - starts[found]) / span)) };
    }

    function restore(a) {
      if (!a || a.p < 0 || !starts.length) { setPage(0, true); return; }
      const i = Math.min(a.p, starts.length - 1);
      const span = ends[i] - starts[i] + 1;
      setPage(starts[i] + Math.min(span - 1, Math.floor((a.off || 0) * span)), true);
    }

    const pct = () => (pages > 1 ? page / (pages - 1) : 1);
    function goPct(x) { setPage(Math.round(Math.min(1, Math.max(0, x)) * (pages - 1)), true); }
    const atEnd = () => page >= pages - 1;

    // ======================= геометрия загиба =======================
    // C — поднимаемый угол страницы, P — где этот угол сейчас.
    // Линия сгиба — серединный перпендикуляр к отрезку C–P.
    // Часть страницы за линией сгиба отражается через неё — это видимая изнанка.

    function clipHalf(poly, M, n, sign) {          // часть многоугольника по одну сторону линии
      const side = (X) => sign * ((X.x - M.x) * n.x + (X.y - M.y) * n.y);
      const out = [];
      for (let i = 0; i < poly.length; i++) {
        const A = poly[i], B = poly[(i + 1) % poly.length];
        const sa = side(A), sb = side(B);
        if (sa >= 0) out.push(A);
        if ((sa >= 0) !== (sb >= 0)) {
          const k = sa / (sa - sb);
          out.push({ x: A.x + (B.x - A.x) * k, y: A.y + (B.y - A.y) * k });
        }
      }
      return out;
    }

    function polyCss(pts) {
      if (pts.length < 3) return 'polygon(0 0, 0 0, 0 0)';
      return 'polygon(' + pts.map((p) => p.x.toFixed(1) + 'px ' + p.y.toFixed(1) + 'px').join(', ') + ')';
    }

    // Угол не может оторваться от корешка: он движется не дальше ширины страницы от края корешка
    function constrain(P, C) {
      const S1 = { x: 0, y: C.y }, S2 = { x: 0, y: vh - C.y }, D = Math.hypot(vw, vh);
      let x = P.x, y = C.y === 0 ? Math.max(0, P.y) : Math.min(vh, P.y);
      x = Math.min(vw, x);
      let dx = x - S1.x, dy = y - S1.y, L = Math.hypot(dx, dy);
      if (L > vw) { x = S1.x + dx * vw / L; y = S1.y + dy * vw / L; }
      dx = x - S2.x; dy = y - S2.y; L = Math.hypot(dx, dy);
      if (L > D) { x = S2.x + dx * D / L; y = S2.y + dy * D / L; }
      return { x: x, y: y };
    }

    function placeStrip(el, M, n, length, depth) {   // полоса вдоль линии сгиба, уходящая в сторону n
      const ang = Math.atan2(-n.x, n.y);
      el.style.width = length + 'px';
      el.style.height = Math.max(1, depth) + 'px';
      el.style.transform = 'translate(' + M.x.toFixed(1) + 'px,' + M.y.toFixed(1) + 'px) rotate(' + ang +
        'rad) translate(' + (-length / 2) + 'px,0)';
    }

    function renderCurl() {
      const C = drag.corner, P = drag.P;
      const dx = C.x - P.x, dy = C.y - P.y, dist = Math.hypot(dx, dy);
      if (dist < 0.5) {
        front.style.clipPath = 'none';
        flap.classList.remove('is-on');
        cast.classList.remove('is-on');
        return;
      }
      const n = { x: dx / dist, y: dy / dist };
      const M = { x: (C.x + P.x) / 2, y: (C.y + P.y) / 2 };
      const rect = [{ x: 0, y: 0 }, { x: vw, y: 0 }, { x: vw, y: vh }, { x: 0, y: vh }];
      const keep = clipHalf(rect, M, n, -1);
      const cut = clipHalf(rect, M, n, 1);

      front.style.clipPath = polyCss(keep);
      flap.style.clipPath = polyCss(cut);

      // Отражение через линию сгиба: X' = X − 2n·((X − M)·n)
      const a = 1 - 2 * n.x * n.x, b = -2 * n.x * n.y, d = 1 - 2 * n.y * n.y;
      const nm = n.x * M.x + n.y * M.y;
      flap.style.transform = 'matrix(' + a + ',' + b + ',' + b + ',' + d + ',' + (2 * n.x * nm) + ',' + (2 * n.y * nm) + ')';
      flap.classList.toggle('is-on', cut.length >= 3);

      let depth = 0;
      cut.forEach((X) => { depth = Math.max(depth, (X.x - M.x) * n.x + (X.y - M.y) * n.y); });
      const L = 2 * Math.hypot(vw, vh);
      placeStrip(crease, M, n, L, depth);

      // Тень на следующей странице: сильнее в середине переворота, слабее в начале и в конце
      const k = Math.min(1, dist / 90) * Math.min(1, Math.max(0, (2 * vw - dist) / (0.5 * vw)));
      placeStrip(cast, M, n, L, 24 + Math.min(70, dist * 0.16));
      cast.style.opacity = String(k);
      cast.classList.toggle('is-on', k > 0.01);
    }

    function renderFlip(k) {                         // k: 0 — лежит, 1 — перевёрнута
      front.style.clipPath = 'none';
      front.style.transform = 'rotateY(' + (-180 * k) + 'deg)';
      fshade.style.opacity = String(Math.min(1, k * 1.8));
    }

    // Насколько перевёрнута страница (0..1), чтобы решить, довернуть или вернуть
    function progress() {
      if (!drag) return 0;
      if (drag.mode === 'flip') return drag.k;
      return Math.min(1, Math.max(0, (vw - drag.P.x) / (2 * vw)));
    }

    function render() {
      if (drag.mode === 'flip') renderFlip(drag.k); else renderCurl();
    }

    // dir: 1 — вперёд, −1 — назад. y — где взялись за страницу (выбираем верхний или нижний угол)
    function begin(dir, y) {
      const target = page + dir;
      if (target < 0 || target >= pages) return false;
      const turning = dir > 0 ? page : target;       // страница, которая переворачивается
      const under = dir > 0 ? target : page;         // страница под ней
      const mode = effect() === 'flip' ? 'flip' : 'curl';
      const corner = { x: vw, y: y < vh / 2 ? 0 : vh };
      drag = {
        dir: dir, target: target, mode: mode, corner: corner,
        P: dir > 0 ? { x: corner.x, y: corner.y } : { x: -vw, y: corner.y },
        k: dir > 0 ? 0 : 1,
      };
      shift(flowFront, turning);
      shift(flowMirror, turning);
      shift(flowBase, under);
      pager.classList.toggle('is-flip', mode === 'flip');
      front.style.transform = '';
      front.classList.add('is-on');
      render();
      return true;
    }

    function hideTurn() {
      drag = null;
      front.classList.remove('is-on');
      flap.classList.remove('is-on');
      cast.classList.remove('is-on');
      front.style.clipPath = 'none';
      front.style.transform = '';
    }

    function animate(dur, step, done) {
      const t0 = performance.now();
      const frame = (now) => {
        const x = dur ? Math.min(1, (now - t0) / dur) : 1;
        step(x);
        if (x < 1) requestAnimationFrame(frame); else done();
      };
      requestAnimationFrame(frame);
    }

    // Довернуть страницу (commit) или вернуть на место. lift — приподнять угол по дуге (для тапа)
    function finish(commit, lift) {
      const d = drag;
      if (!d) return;
      busy = true;
      if (commit) {
        Sound.play();
        try { tg && tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
      }
      const turnedTo = (d.dir > 0) === commit;       // страница в итоге оказывается перевёрнутой?
      const done = () => {
        busy = false;
        hideTurn();
        if (commit) {
          setPage(d.target);
          if (!turnedOnce) { turnedOnce = true; showBar(false); }
        } else {
          shift(flowBase, page);
        }
      };
      if (effect() === 'none') { done(); return; }

      if (d.mode === 'flip') {
        const from = d.k, to = turnedTo ? 1 : 0;
        const dur = 90 + 380 * Math.abs(to - from);
        animate(dur, (x) => { d.k = from + (to - from) * (1 - Math.pow(1 - x, 3)); renderFlip(d.k); }, done);
        return;
      }

      const from = { x: d.P.x, y: d.P.y };
      const to = turnedTo ? { x: -vw, y: d.corner.y } : { x: d.corner.x, y: d.corner.y };
      const dist = Math.hypot(to.x - from.x, to.y - from.y);
      const dur = lift ? 560 : 110 + 380 * dist / (2 * vw);
      const up = d.corner.y === 0 ? 1 : -1;
      animate(dur, (x) => {
        const e = lift ? (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2) : 1 - Math.pow(1 - x, 3);
        const arc = lift ? Math.sin(Math.PI * e) * vh * 0.14 * up : 0;
        d.P = constrain({ x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e + arc }, d.corner);
        renderCurl();
      }, done);
    }

    function turn(dir) {
      stopHint();
      if (busy || drag) return;
      if (begin(dir, vh)) finish(true, true);
      else edge(dir);
    }

    // Листаешь дальше последней страницы — следующая глава, назад с первой — конец предыдущей
    function edge(dir) {
      const i = CHAPTERS.indexOf(current);
      const ch = CHAPTERS[i + dir];
      if (!ch || !isOpen(ch)) return;
      Sound.play();
      if (dir < 0) pendingPct = 1;
      replaceHash(ch.id);
    }

    // Подсказка: в первый раз уголок сам чуть отгибается — видно, что за него можно взяться
    function hint() {
      if (hinted || !active || drag || busy || effect() !== 'curl' || pages < 2 || page >= pages - 1) return;
      hinted = true;
      if (!begin(1, vh)) return;
      busy = true;
      hinting = true;
      const d = drag, C = d.corner;
      animate(1100, (x) => {
        if (drag !== d) return;
        const s = Math.sin(Math.PI * x);
        d.P = { x: C.x - 58 * s, y: C.y - 40 * s };
        renderCurl();
      }, () => {
        if (drag !== d) return;
        stopHint();
      });
    }

    function stopHint() {                 // читатель коснулся экрана — подсказка сразу исчезает
      if (!hinting) return;
      hinting = false;
      busy = false;
      hideTurn();
      shift(flowBase, page);
    }

    // ======================= жесты =======================
    let start = null;
    pager.addEventListener('pointerdown', (e) => {
      Sound.wake();
      stopHint();
      if (!active || busy || (e.button && e.button > 0)) return;
      if (e.target.closest('button, a, input')) return;
      hinted = true;
      start = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, moved: false };
    });

    pager.addEventListener('pointermove', (e) => {
      if (!start || e.pointerId !== start.id) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!start.moved) {
        if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
        start.moved = true;
        start.dir = dx < 0 ? 1 : -1;
        start.ok = begin(start.dir, start.y);
        try { pager.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (!start.ok || !drag) return;
      if (drag.mode === 'flip') {
        const t = Math.min(1, Math.max(0, (start.dir > 0 ? -dx : dx) / (vw * 0.85)));
        drag.k = start.dir > 0 ? t : 1 - t;
        renderFlip(drag.k);
      } else {
        const C = drag.corner;
        const P = start.dir > 0
          ? { x: C.x + dx * 1.15, y: C.y + dy * 0.9 }      // угол идёт за пальцем
          : { x: -vw + dx * 2.3, y: C.y + dy * 0.9 };     // назад: страница возвращается слева
        drag.P = constrain(P, C);
        renderCurl();
      }
    });

    function release(e) {
      if (!start || e.pointerId !== start.id) return;
      const s = start;
      start = null;
      const dx = e.clientX - s.x;
      if (!s.moved) {                                     // это тап
        const x = e.clientX / window.innerWidth;
        if (x > 0.7) turn(1);
        else if (x < 0.3) turn(-1);
        else showBar(els.bar.classList.contains('is-hidden'));
        return;
      }
      if (!s.ok) { if (Math.abs(dx) > 70) edge(s.dir); return; }
      const v = Math.abs(dx) / Math.max(1, performance.now() - s.t);   // скорость, пикс/мс
      const p = progress();
      const turned = s.dir > 0 ? p : 1 - p;               // насколько продвинулись в нужную сторону
      finish(turned > 0.28 || (v > 0.45 && turned > 0.03), false);
    }
    pager.addEventListener('pointerup', release);
    pager.addEventListener('pointercancel', () => { if (start && start.ok) finish(false, false); start = null; });

    document.addEventListener('keydown', (e) => {
      if (!active || !els.scrim.hidden) return;
      Sound.wake();
      if (['ArrowRight', 'PageDown', ' '].indexOf(e.key) >= 0) { e.preventDefault(); turn(1); }
      if (['ArrowLeft', 'PageUp'].indexOf(e.key) >= 0) { e.preventDefault(); turn(-1); }
    });

    let resizeTimer = 0;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => relayout(true), 150);
    });

    return {
      get active() { return active; },
      mount: mount, unmount: unmount, relayout: relayout,
      anchor: anchor, restore: restore, pct: pct, goPct: goPct, atEnd: atEnd,
      takePending: () => { const v = pendingPct; pendingPct = null; return v; },
    };
  })();


  /* =======================================================
     9. НИЖНИЕ ПАНЕЛИ
     ======================================================= */
  let openSheetEl = null, lastFocus = null, closeTimer = 0;

  function openSheet(sheet) {
    if (openSheetEl) closeSheet(true);
    clearTimeout(closeTimer);
    lastFocus = document.activeElement;
    els.scrim.hidden = false;
    sheet.hidden = false;
    sheet.getBoundingClientRect();
    els.scrim.classList.add('is-open');
    sheet.classList.add('is-open');
    openSheetEl = sheet;
    sheet.focus({ preventScroll: true });
  }

  function closeSheet(instant) {
    const sheet = openSheetEl;
    if (!sheet) return;
    openSheetEl = null;
    els.scrim.classList.remove('is-open');
    sheet.classList.remove('is-open');
    const finish = () => {
      if (!sheet.classList.contains('is-open')) sheet.hidden = true;
      if (!openSheetEl) els.scrim.hidden = true;
    };
    if (instant) finish(); else closeTimer = setTimeout(finish, 280);
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }

  els.scrim.onclick = () => closeSheet();
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
  document.querySelectorAll('[data-close]').forEach((b) => { b.onclick = () => closeSheet(); });
  document.querySelectorAll('[data-open-settings]').forEach((b) => {
    b.onclick = () => { renderSub(); openSheet(els.settings); };
  });


  /* =======================================================
     10. ПОДПИСКА И ОПЛАТА
     Читатель: кнопка «Открыть за ⭐» → окно оплаты → глава сразу открыта.
     Сейчас окно оплаты тестовое. На шаге 6 в buyStars() будет так:
       сервер создаёт ссылку на оплату (createInvoiceLink, валюта XTR,
       subscription_period 30 дней) → tg.openInvoice(ссылка, статус => ...)
       → при статусе 'paid' сервер включает доступ.
     ======================================================= */
  function buildPaywall(ch) {
    const box = el('div', 'paywall');
    const k = el('p', 'pw-kicker');
    k.append(lockIcon(), document.createTextNode(fullName(ch)));
    if (ch.adult) k.append(el('span', 'badge', '18+'));
    box.append(k, el('h3', 'pw-title', t('pwTitle')), el('p', 'pw-perks', t('pwPerks')));
    box.append(el('p', 'pw-price', t('pwPrice', { stars: PRICE.stars, usd: PRICE.usd })));

    const buy = el('button', 'btn', t('pwUnlock', { stars: PRICE.stars }));
    buy.type = 'button';
    buy.onclick = () => { pending = ch; buyStars(); };
    box.append(buy);

    // Русским код подписчика Boosty показываем заметной кнопкой, остальным — ссылкой
    const code = el('button', lang === 'ru' ? 'btn btn-ghost' : 'text-link', t('pwCode'));
    code.type = 'button';
    code.onclick = () => { pending = ch; openCode(); };
    box.append(code, el('p', 'pw-cancel', t('pwCancel')));
    return box;
  }

  function openLock(ch) {
    pending = ch;
    $('lock-body').replaceChildren(buildPaywall(ch));
    openSheet(els.lock);
  }

  function buyStars() {
    openSheet(els.pay);   // ТЕСТ. На шаге 6 — tg.openInvoice(...)
  }

  $('pay-btn').onclick = () => {
    const btn = $('pay-btn');
    btn.disabled = true;
    btn.textContent = t('paying');
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = t('payBtn', { stars: PRICE.stars });
      grantAccess('stars');
      closeSheet(true);
      afterUnlock(t('paidToast'));
    }, 900);
  };

  function grantAccess(via) {
    access = { until: Date.now() + PRICE.days * 864e5, via: via };
    Store.set('access', access);
  }

  function afterUnlock(message) {
    try { tg && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    toast(message);
    const ch = pending;
    pending = null;
    if (ch) {
      if (current) replaceHash(ch.id); else goChapter(ch);
    } else if (current) {
      renderEnd(current);
    } else {
      renderToc();
    }
  }

  // --- Код доступа. Сейчас проверка тестовая; на шаге с кодами проверять будет сервер
  function openCode() {
    $('code-input').value = '';
    $('code-error').textContent = '';
    openSheet(els.code);
    setTimeout(() => $('code-input').focus(), 300);
  }

  function checkCode(raw) {
    return String(raw || '').trim().toUpperCase() === TEST_CODE;
  }

  function submitCode() {
    const value = $('code-input').value;
    if (!value.trim()) { $('code-error').textContent = t('codeEmpty'); return; }
    if (!checkCode(value)) { $('code-error').textContent = t('codeBad'); return; }
    grantAccess('code');
    closeSheet(true);
    afterUnlock(t('codeOk', { date: fmtDate(access.until) }));
  }

  $('code-btn').onclick = submitCode;
  $('code-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitCode(); });

  // Ссылка с кодом: t.me/бот?startapp=code_TEST  (в браузере для теста: reader.html?code=TEST)
  // Ссылка на главу: t.me/бот?startapp=ch3
  let startHandled = false;
  function handleStartParam() {
    if (startHandled) return;
    const q = new URLSearchParams(location.search);
    const param = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) ||
      q.get('tgWebAppStartParam') || (q.get('code') ? 'code_' + q.get('code') : '');
    if (!param) return;
    startHandled = true;

    if (param.indexOf('code_') === 0) {
      if (checkCode(param.slice(5))) {
        grantAccess('code');
        afterUnlock(t('codeOk', { date: fmtDate(access.until) }));
      } else {
        toast(t('codeBad'));
      }
      return;
    }
    const ch = CHAPTERS.find((c) => c.id === param);
    if (ch) { if (isOpen(ch)) replaceHash(ch.id); else openLock(ch); }   // без лишней записи в истории
  }

  function renderSub() {
    $('sub-status').textContent = hasAccess() ? t('subActive', { date: fmtDate(access.until) }) : t('subNone');
    $('sub-cancel').hidden = !hasAccess();
  }

  $('sub-cancel').onclick = () => {
    access = null;
    Store.remove('access');
    renderSub();
    toast(t('subCanceled'));
    if (current && !isOpen(current)) { closeSheet(true); replaceHash(''); }
    else if (current) renderEnd(current);
    else renderToc();
  };


  /* =======================================================
     11. НАСТРОЙКИ ОФОРМЛЕНИЯ И ЯЗЫК
     ======================================================= */
  function buildSettings() {
    const box = $('font-list');
    FONTS.forEach((f) => {
      const b = el('button', 'font-opt');
      b.type = 'button';
      b.dataset.font = f.id;
      const sample = el('span', 'sample');
      sample.style.fontFamily = f.css;
      b.append(sample, el('span', 'name', f.name));
      b.onclick = () => { S.font = f.id; applySettings(true); };
      box.append(b);
    });

    document.querySelectorAll('[data-theme-v]').forEach((b) => {
      b.onclick = () => { S.theme = b.dataset.themeV; applySettings(false); };
    });
    document.querySelectorAll('[data-line]').forEach((b) => {
      b.onclick = () => { S.line = b.dataset.line; applySettings(true); };
    });
    document.querySelectorAll('[data-justify]').forEach((b) => {
      b.onclick = () => { S.justify = b.dataset.justify === '1'; applySettings(true); };
    });
    document.querySelectorAll('[data-lang]').forEach((b) => {
      b.onclick = () => setLang(b.dataset.lang, true);
    });
    document.querySelectorAll('[data-mode]').forEach((b) => {
      b.onclick = () => setMode(b.dataset.mode);
    });
    document.querySelectorAll('[data-flip]').forEach((b) => {
      b.onclick = () => { S.flip = b.dataset.flip; Store.set('settings', S); syncSettingsUI(); };
    });
    document.querySelectorAll('[data-sound]').forEach((b) => {
      b.onclick = () => {
        S.sound = b.dataset.sound === '1';
        Store.set('settings', S);
        syncSettingsUI();
        if (S.sound) Sound.play();          // сразу слышно, как звучит
      };
    });
    $('size-down').onclick = () => { S.size = Math.max(SIZE_MIN, S.size - 1); applySettings(true); };
    $('size-up').onclick   = () => { S.size = Math.min(SIZE_MAX, S.size + 1); applySettings(true); };

    const reset = $('reset');
    let armed = 0;
    reset.onclick = () => {
      if (!armed) {
        reset.textContent = t('resetConfirm');
        armed = setTimeout(() => { armed = 0; reset.textContent = t('reset'); }, 3000);
        return;
      }
      clearTimeout(armed); armed = 0;
      progress = {};
      Store.set('progress', progress);
      Store.remove('last');
      reset.textContent = t('resetDone');
      setTimeout(() => { reset.textContent = t('reset'); }, 2000);
      if (!current) renderToc();
    };
  }

  // Страницами или прокруткой: место чтения сохраняется при переключении
  function setMode(mode) {
    if (S.mode === mode) return;
    const a = current ? currentAnchor() : null;
    S.mode = mode;
    Store.set('settings', S);
    syncSettingsUI();
    if (!current) return;
    if (mode === 'pages') Pager.mount();
    else { Pager.unmount(); showBar(true); }
    restoreAnchor(a);
    lastY = window.scrollY;
    updateProgress();
  }

  function syncSettingsUI() {
    const press = (sel, test) => document.querySelectorAll(sel).forEach((b) => b.setAttribute('aria-pressed', String(test(b))));
    press('[data-theme-v]', (b) => b.dataset.themeV === S.theme);
    press('.font-opt',      (b) => b.dataset.font === S.font);
    press('[data-line]',    (b) => b.dataset.line === S.line);
    press('[data-justify]', (b) => (b.dataset.justify === '1') === !!S.justify);
    press('[data-lang]',    (b) => b.dataset.lang === lang);
    press('[data-mode]',    (b) => b.dataset.mode === S.mode);
    press('[data-sound]',   (b) => (b.dataset.sound === '1') === !!S.sound);
    press('[data-flip]',    (b) => b.dataset.flip === S.flip);
    document.querySelectorAll('.font-opt .sample').forEach((s) => {
      s.textContent = lang === 'ru' ? 'Ветки не уползают' : 'Branches don’t crawl';
    });
    $('size-val').textContent = S.size;
    $('size-down').disabled = S.size <= SIZE_MIN;
    $('size-up').disabled = S.size >= SIZE_MAX;
  }

  function applySettings(keepPlace) {
    const anchor = keepPlace && current ? currentAnchor() : null;
    const font = FONTS.find((f) => f.id === S.font) || FONTS[0];

    root.dataset.theme = S.theme;
    root.style.setProperty('--read-font', font.css);
    root.style.setProperty('--read-size', S.size + 'px');
    root.style.setProperty('--read-lh', String(LINE[S.line] || LINE.normal));
    els.prose.classList.toggle('is-justify', !!S.justify);

    const color = THEME_COLOR[S.theme] || THEME_COLOR.dark;
    els.metaTheme.setAttribute('content', color);
    if (tg) { try { tg.setHeaderColor(color); tg.setBackgroundColor(color); } catch (e) {} }

    if (anchor && Pager.active) Pager.relayout(false);
    if (anchor) { restoreAnchor(anchor); lastY = window.scrollY; updateProgress(); }
    syncSettingsUI();
    Store.set('settings', S);
  }

  function setLang(next, remember) {
    if (remember) { S.lang = next; Store.set('settings', S); }
    if (next === lang) { syncSettingsUI(); return; }
    lang = next;
    applyI18n();
    syncSettingsUI();
    renderSub();
    if (current) { const pct = getPct(); openChapter(current, pct); }
    else renderToc();
  }


  /* =======================================================
     12. TELEGRAM
     Срабатывает, только когда страница открыта внутри Telegram.
     ======================================================= */
  function syncBackButton() {
    if (!tg) return;
    try { if (current) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {}
  }

  function initTelegram() {
    const w = window.Telegram && window.Telegram.WebApp;
    if (!w || !w.initData || tg) return;     // открыто в обычном браузере
    tg = w;
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.disableVerticalSwipes(); } catch (e) {}   // чтобы свайп по тексту не закрывал читалку
    try { tg.BackButton.onClick(goToc); } catch (e) {}
    if (!S.lang) setLang(detectLang(), false);
    applySettings(false);
    syncBackButton();
    handleStartParam();
  }
  window.__onTgSdk = initTelegram;


  /* =======================================================
     13. ЗАПУСК
     ======================================================= */
  buildSettings();
  applyI18n();
  applySettings(false);
  window.addEventListener('hashchange', route);
  route();
  initGate();
  initTelegram();
  // Внутри Telegram ссылку разбирает initTelegram(), когда загрузится библиотека
  if (!/tgWebApp/.test(location.hash + location.search)) handleStartParam();
})();
</script>
</body>
</html>
